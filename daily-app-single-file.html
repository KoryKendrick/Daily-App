<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e10" />
<title>Daily — 4 Pillars</title>
<style>
/* ---------------------------------------------------------------
   Daily — 4 Pillars
   Dark + gold theme modelled on the reference screenshot.
--------------------------------------------------------------- */
:root {
  --bg:            #0e0e10;
  --bg-soft:       #17181b;
  --card:          #1b1c1f;
  --card-2:        #212226;
  --line:          #2c2d32;

  --gold-1:        #f5e08a;
  --gold-2:        #e8c85f;
  --gold-3:        #c9a63c;
  --gold-dim-1:    #7a6a30;
  --gold-dim-2:    #6a5c2a;

  --teal:          #4fd1a5;
  --text:          #f3f4f6;
  --text-dim:      #9aa0a6;
  --text-faint:    #6b7076;
  --danger:        #f07171;

  --radius:        16px;
  --radius-sm:     12px;
  --tab-h:         64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  line-height: 1.4;
}

.phone {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 14px calc(var(--tab-h) + 28px);
  position: relative;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ------------------------- header ------------------------- */
.app-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 2px 12px;
}

.menu-btn {
  width: 40px; height: 34px;
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 8px;
}
.menu-btn span {
  display: block; height: 2.5px; border-radius: 2px;
  background: var(--gold-2);
}
.menu-btn span:nth-child(2) { width: 80%; }

.who { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }

.avatar {
  width: 42px; height: 42px; flex: 0 0 42px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--gold-1), var(--gold-3));
  color: #22200f;
  font-weight: 800; font-size: 18px;
  display: grid; place-items: center;
  border: 2px solid #3a3413;
}

.who-name { font-size: 21px; font-weight: 800; letter-spacing: .2px; line-height: 1.1; }
.who-sub  { font-size: 13px; color: var(--text-faint); }

.badges { display: flex; gap: 7px; align-items: center; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 13px; font-weight: 700;
  white-space: nowrap;
  background: #241f10;
  border: 1px solid var(--gold-dim-1);
  color: var(--gold-1);
}
.pill-dot {
  width: 17px; height: 17px; border-radius: 50%;
  background: linear-gradient(145deg, var(--gold-1), var(--gold-3));
  color: #241f10; font-size: 11px; font-weight: 900;
  display: grid; place-items: center;
}
.badge-streak .flame { font-size: 13px; }

/* ------------------------- search ------------------------- */
.searchbar {
  display: flex; align-items: center; gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px 14px;
  margin-bottom: 16px;
}
.search-ico {
  width: 19px; height: 19px; flex: 0 0 19px;
  fill: none; stroke: var(--text-faint); stroke-width: 2; stroke-linecap: round;
}
.searchbar input {
  background: none; border: 0; outline: none; width: 100%;
  font-size: 15px;
}
.searchbar input::placeholder { color: var(--text-faint); }

/* ------------------------- cards ------------------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}

.progress-card { margin-bottom: 18px; }

.progress-top { display: flex; justify-content: space-between; align-items: center; }
.progress-top h2 { margin: 0; font-size: 19px; font-weight: 700; }

.select-wrap {
  position: relative;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.select-wrap::after {
  content: "";
  position: absolute; right: 11px; top: 46%;
  width: 7px; height: 7px;
  border-right: 2px solid var(--text-dim);
  border-bottom: 2px solid var(--text-dim);
  transform: translateY(-50%) rotate(45deg);
  pointer-events: none;
}
.select-wrap select {
  appearance: none; -webkit-appearance: none;
  background: none; border: 0; outline: none;
  padding: 8px 30px 8px 13px;
  font-size: 14px; font-weight: 600;
  border-radius: 10px;
}
.select-wrap select option { background: var(--card-2); }

.points-line { display: flex; align-items: baseline; gap: 7px; margin: 12px 0 6px; }
.points-num { font-size: 40px; font-weight: 800; line-height: 1; }
.points-label { color: var(--text-dim); font-size: 15px; }

/* ------------------------- chart ------------------------- */
.chart {
  --rows: 5;
  position: relative;
  height: 168px;
  margin-top: 10px;
  padding: 4px 0 24px 26px;
  display: flex; align-items: flex-end; gap: 6px;
}
.chart .grid {
  position: absolute; inset: 4px 0 24px 26px;
  display: flex; flex-direction: column; justify-content: space-between;
  pointer-events: none;
}
.chart .grid-line { border-top: 1px dashed #2f3035; position: relative; }
.chart .grid-line span {
  position: absolute; left: -26px; top: -9px;
  font-size: 11px; color: var(--text-faint); width: 22px; text-align: right;
}
.chart .target {
  position: absolute; left: 26px; right: 0;
  border-top: 2px solid #5b8fb4;
  opacity: .85;
  pointer-events: none;
}
.chart .bar-col {
  position: relative; z-index: 1;
  flex: 1 1 0; height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.chart .bar {
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(180deg, var(--gold-dim-1), #4b421d);
  border: 1px solid var(--gold-dim-2);
  border-bottom: 0;
  min-height: 2px;
  transition: height .35s ease;
}
.chart .bar.full {
  background: linear-gradient(180deg, var(--gold-2), var(--gold-3));
  border-color: var(--gold-1);
}
.chart .bar.today { box-shadow: 0 0 0 1px var(--gold-1) inset; }
.chart .bar-label {
  position: absolute; bottom: -21px; left: 0; right: 0;
  text-align: center; font-size: 11px; color: var(--text-faint);
}

/* ------------------------- date nav ------------------------- */
.datenav {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 4px 0 14px;
}
.date-arrow {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--line);
  color: var(--gold-2); font-size: 20px; line-height: 1;
}
.date-arrow:disabled { opacity: .3; cursor: not-allowed; }
.date-label {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 18px;
  font-size: 14px; font-weight: 700; color: var(--text-dim);
  min-width: 170px;
}
.date-label.past { color: var(--gold-2); border-color: var(--gold-dim-1); }

/* ------------------------- section titles ------------------------- */
.section-title {
  text-align: center;
  font-size: 21px; font-weight: 700;
  margin: 18px 0 12px;
}
.section-title.left { text-align: left; margin-left: 2px; }

/* ------------------------- pillars ------------------------- */
.pillars { display: flex; flex-direction: column; gap: 12px; }

.pillar {
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--card);
  padding: 13px 13px 14px;
  transition: background .3s ease, border-color .3s ease;
}
.pillar.complete {
  background: linear-gradient(150deg, #6f6128, #4a4019 62%, #3c3415);
  border-color: var(--gold-2);
  box-shadow: 0 0 0 1px rgba(232,200,95,.25), 0 8px 22px -14px rgba(232,200,95,.6);
}

.pillar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.pillar-head h3 { margin: 0; font-size: 21px; font-weight: 700; }

.count {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 11px;
  display: inline-flex; align-items: center; gap: 5px;
}
.pillar.complete .count {
  color: var(--teal);
  background: rgba(0,0,0,.28);
  border-color: rgba(79,209,165,.55);
}
.count .ticks { display: none; color: var(--teal); font-weight: 900; letter-spacing: -2px; }
.pillar.complete .count .ticks { display: inline; }

.pillar-body { display: flex; align-items: stretch; gap: 7px; }

.pillar-icon {
  width: 46px; flex: 0 0 46px;
  border-radius: var(--radius-sm);
  background: #17181b;
  border: 1px solid var(--line);
  display: grid; place-items: center;
}
.pillar-icon svg { width: 26px; height: 26px; }
.pillar.complete .pillar-icon { background: #14150f; border-color: #3f3a1c; }

/* checkbox tasks — the core of the screen */
.task {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  text-align: left;
  padding: 13px 9px;
  border-radius: var(--radius-sm);
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: clamp(12.4px, 3.35vw, 14.5px); font-weight: 600;
  letter-spacing: -.1px;
  transition: transform .12s ease, background .25s ease, color .25s ease, border-color .25s ease;
}
.task:active { transform: scale(.97); }

.task .box {
  width: 20px; height: 20px; flex: 0 0 20px;
  border-radius: 50%;
  border: 2px solid #6d7278;
  display: grid; place-items: center;
  transition: background .2s ease, border-color .2s ease;
}
.task .box svg { width: 12px; height: 12px; opacity: 0; stroke: #1b1a10; stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.task.done {
  background: linear-gradient(140deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
  border-color: var(--gold-1);
  color: #201d0d;
}
.task.done .box { background: #1e1c0e; border-color: #1e1c0e; }
.task.done .box svg { opacity: 1; stroke: var(--gold-1); }
.task .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------- bonus ------------------------- */
.bonus-row { display: flex; gap: 12px; margin-bottom: 12px; }
.bonus-btn {
  flex: 1 1 0;
  display: flex; align-items: center; gap: 9px;
  padding: 13px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--gold-dim-1);
  background: linear-gradient(140deg, #b8a04a, #d9bf5d);
  color: #241f0c;
  font-weight: 700; font-size: 15px;
  position: relative;
}
.bonus-btn:nth-child(2) { background: linear-gradient(140deg, var(--gold-1), var(--gold-2)); }
.bonus-btn:active { transform: scale(.98); }
.bonus-ico {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
  background: rgba(255,255,255,.42);
  display: grid; place-items: center;
}
.bonus-ico svg { width: 17px; height: 17px; fill: none; stroke: #241f0c; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.bonus-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bonus-count {
  position: absolute; top: -6px; right: -4px;
  min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 999px;
  background: var(--teal); color: #05261c;
  font-size: 12px; font-weight: 900;
  display: none; place-items: center;
}
.bonus-count.show { display: grid; }

/* ------------------------- blocks (goals / prayers) ------------------------- */
.block { margin-top: 24px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.block-head h2 { margin: 0; font-size: 21px; font-weight: 700; }
.block-head h2.accent { color: var(--teal); }
.block-meta { font-size: 13px; color: var(--text-faint); font-weight: 600; }

.composer {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex; flex-direction: column; gap: 9px;
}
.composer textarea, .composer input[type="text"] {
  width: 100%;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 11px 12px;
  outline: none;
  resize: vertical;
  font-size: 15px;
}
.composer textarea::placeholder, .composer input::placeholder { color: var(--text-faint); }
.composer textarea:focus, .composer input:focus { border-color: var(--gold-dim-1); }

.composer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.composer-row select {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 11px; outline: none;
  font-size: 14px; font-weight: 600;
}
.tiny-note { font-size: 12px; color: var(--text-faint); }

.add-btn {
  background: linear-gradient(140deg, var(--gold-1), var(--gold-3));
  color: #221e0c;
  border: 0; border-radius: 11px;
  padding: 10px 18px;
  font-weight: 800; font-size: 14px;
  white-space: nowrap;
}
.add-btn:active { transform: scale(.97); }
.ghost-btn {
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 11px; padding: 10px 18px; font-weight: 700; font-size: 14px;
}

/* ------------------------- entry lists ------------------------- */
.entry-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }

.entry {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 12px 12px 12px;
  display: flex; gap: 10px; align-items: flex-start;
}
.entry.done { background: linear-gradient(140deg, #4a4019, #3a3214); border-color: var(--gold-dim-1); }

.entry-check {
  width: 22px; height: 22px; flex: 0 0 22px; margin-top: 1px;
  border-radius: 50%;
  border: 2px solid #6d7278;
  background: none;
  display: grid; place-items: center;
  padding: 0;
}
.entry.done .entry-check { background: var(--gold-2); border-color: var(--gold-1); }
.entry-check svg { width: 12px; height: 12px; opacity: 0; fill: none; stroke: #241f0c; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.entry.done .entry-check svg { opacity: 1; }

.entry-main { flex: 1 1 auto; min-width: 0; }
.entry-title { font-weight: 700; font-size: 15px; word-wrap: break-word; }
.entry.done .entry-title { text-decoration: line-through; opacity: .75; }
.entry-body { font-size: 14px; color: var(--text-dim); white-space: pre-wrap; word-wrap: break-word; margin-top: 3px; }
.entry-meta { font-size: 12px; color: var(--text-faint); margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
  padding: 2px 8px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--line); color: var(--text-dim);
}
.tag.faith   { color: #9fd3ff; border-color: #2c4257; }
.tag.family  { color: #ff9d9d; border-color: #5a3030; }
.tag.fitness { color: #7fe3c4; border-color: #24544a; }
.tag.finance { color: var(--gold-1); border-color: var(--gold-dim-1); }
.tag.answered { color: var(--teal); border-color: rgba(79,209,165,.5); }

.entry-actions { display: flex; gap: 4px; flex: 0 0 auto; }
.mini-btn {
  background: none; border: 0; padding: 5px 7px; border-radius: 8px;
  color: var(--text-faint); font-size: 13px; font-weight: 700;
}
.mini-btn:hover { background: var(--card-2); color: var(--text); }
.mini-btn.danger:hover { color: var(--danger); }

.empty {
  color: var(--text-faint); font-size: 14px; text-align: center;
  padding: 16px 8px; border: 1px dashed var(--line); border-radius: var(--radius);
}

/* ------------------------- footer / tabs ------------------------- */
.foot { display: flex; gap: 14px; justify-content: center; margin: 30px 0 6px; }
.link-btn { background: none; border: 0; color: var(--text-faint); font-size: 13px; font-weight: 700; text-decoration: underline; }
.link-btn.danger { color: #8a5252; }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  max-width: 480px; margin: 0 auto;
  height: var(--tab-h);
  background: #131417;
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1 1 0;
  background: none; border: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 700; color: var(--text-faint);
}
.tab.active { color: var(--gold-2); }
.tab-ico { font-size: 19px; line-height: 1; }

/* ------------------------- modal / toast ------------------------- */
.modal-backdrop[hidden], .toast[hidden] { display: none !important; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.65);
  display: grid; place-items: center;
  padding: 20px;
}
.modal {
  width: 100%; max-width: 420px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px;
}
.modal h3 { margin: 0 0 10px; font-size: 18px; }
.modal textarea {
  width: 100%; background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 11px 12px; outline: none; resize: vertical; font-size: 15px;
}
.modal textarea:focus { border-color: var(--gold-dim-1); }
.modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
.modal-actions [hidden] { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px);
  transform: translateX(-50%);
  background: #26241a; border: 1px solid var(--gold-dim-1); color: var(--gold-1);
  padding: 10px 16px; border-radius: 999px;
  font-size: 14px; font-weight: 700; z-index: 60;
  animation: pop .2s ease;
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media (max-width: 380px) {
  .task { padding: 12px 7px; gap: 6px; }
  .task .box { width: 18px; height: 18px; flex: 0 0 18px; }
  .pillar-icon { width: 40px; flex: 0 0 40px; }
  .who-name { font-size: 19px; }
  .badge { padding: 5px 9px; font-size: 12px; }
}

</style>
</head>
<body>
<div class="phone">

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <div class="who">
      <div class="avatar" id="avatar">K</div>
      <div class="who-text">
        <div class="who-name" id="userName">Kory</div>
        <div class="who-sub" id="userSub">K</div>
      </div>
    </div>

    <div class="badges">
      <div class="badge badge-points" title="Total points">
        <span class="pill-dot">P</span><span id="totalPoints">0</span>
      </div>
      <div class="badge badge-streak" title="Current streak">
        <span class="flame">&#128293;</span><span id="streakCount">0</span>&nbsp;days
      </div>
    </div>
  </header>

  <div class="searchbar">
    <svg viewBox="0 0 24 24" class="search-ico" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="searchInput" type="search" placeholder="Search goals, prayers, journal" autocomplete="off" />
  </div>

  <main>
    <!-- ============ PROGRESS ============ -->
    <section class="card progress-card">
      <div class="progress-top">
        <h2>Progress</h2>
        <div class="select-wrap">
          <select id="rangeSelect" aria-label="Progress range">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>

      <div class="points-line">
        <span class="points-num" id="rangePoints">0</span>
        <span class="points-label">points</span>
      </div>

      <div class="chart" id="chart" role="img" aria-label="Progress chart"></div>
    </section>

    <!-- ============ DATE NAV ============ -->
    <nav class="datenav">
      <button class="date-arrow" id="prevDay" aria-label="Previous day">&#8249;</button>
      <button class="date-label" id="dateLabel">Today</button>
      <button class="date-arrow" id="nextDay" aria-label="Next day">&#8250;</button>
    </nav>

    <!-- ============ 4 PILLARS ============ -->
    <h2 class="section-title">4 Pillars</h2>
    <div id="pillars" class="pillars"></div>

    <!-- ============ BONUS ============ -->
    <h2 class="section-title left">Bonus Points</h2>
    <div class="bonus-row">
      <button class="bonus-btn" id="gratitudeBtn">
        <span class="bonus-ico">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12c-1.8 4.4-9.3 9-9.3 9z"/></svg>
        </span>
        <span class="bonus-text">Add Gratitude</span>
        <span class="bonus-count" id="gratitudeCount"></span>
      </button>
      <button class="bonus-btn" id="journalBtn">
        <span class="bonus-ico">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 3.5h6v3H9z"/><line x1="8.5" y1="11" x2="15.5" y2="11"/><line x1="8.5" y1="15" x2="13.5" y2="15"/></svg>
        </span>
        <span class="bonus-text">Add Journal</span>
        <span class="bonus-count" id="journalCount"></span>
      </button>
    </div>
    <ul class="entry-list" id="bonusList"></ul>

    <!-- ============ GOALS ============ -->
    <section class="block">
      <div class="block-head">
        <h2 class="accent">Goals</h2>
        <span class="block-meta" id="goalMeta">0/0</span>
      </div>

      <form class="composer" id="goalForm" autocomplete="off">
        <textarea id="goalInput" rows="2" placeholder="Type a goal&hellip; (e.g. Work out 6 days a week)"></textarea>
        <div class="composer-row">
          <select id="goalPillar" aria-label="Goal pillar">
            <option value="faith">Faith</option>
            <option value="family">Family</option>
            <option value="fitness">Fitness</option>
            <option value="finance">Finance</option>
            <option value="other" selected>Other</option>
          </select>
          <button class="add-btn" type="submit">Add Goal</button>
        </div>
      </form>

      <ul class="entry-list" id="goalList"></ul>
    </section>

    <!-- ============ PRAYERS ============ -->
    <section class="block">
      <div class="block-head">
        <h2 class="accent">Prayers</h2>
        <span class="block-meta" id="prayerMeta">0 answered</span>
      </div>

      <form class="composer" id="prayerForm" autocomplete="off">
        <input id="prayerTitle" type="text" placeholder="Who / what are you praying for?" />
        <textarea id="prayerInput" rows="3" placeholder="Type your prayer&hellip;"></textarea>
        <div class="composer-row">
          <label class="tiny-note">Saved privately on this device</label>
          <button class="add-btn" type="submit">Add Prayer</button>
        </div>
      </form>

      <ul class="entry-list" id="prayerList"></ul>
    </section>

    <footer class="foot">
      <button class="link-btn" id="exportBtn">Export data</button>
      <button class="link-btn" id="importBtn">Import</button>
      <button class="link-btn danger" id="resetBtn">Reset all</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </footer>
  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="tabbar">
    <button class="tab active" data-scroll="top"><span class="tab-ico">&#127968;</span>Home</button>
    <button class="tab" data-scroll="pillars"><span class="tab-ico">&#9989;</span>Pillars</button>
    <button class="tab" data-scroll="goalForm"><span class="tab-ico">&#127919;</span>Goals</button>
    <button class="tab" data-scroll="prayerForm"><span class="tab-ico">&#128591;</span>Prayer</button>
  </nav>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Add</h3>
    <textarea id="modalInput" rows="4"></textarea>
    <div class="modal-actions">
      <button class="ghost-btn" id="modalExtra" type="button" hidden></button>
      <button class="ghost-btn" id="modalCancel" type="button">Cancel</button>
      <button class="add-btn" id="modalSave" type="button">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ---------------------------------------------------------------
   Daily — 4 Pillars
   Everything is stored locally in the browser (localStorage).
--------------------------------------------------------------- */
(function () {
  'use strict';

  var STORE_KEY = 'dailyApp.v1';

  /* ---------------- pillar / task definitions ---------------- */
  var PILLARS = [
    {
      id: 'faith', name: 'Faith', icon: 'cross',
      tasks: [{ id: 'bible', label: 'Read bible' }, { id: 'prayer', label: 'Prayer' }]
    },
    {
      id: 'family', name: 'Family', icon: 'family',
      tasks: [{ id: 'marriage', label: 'Marriage' }, { id: 'relationship', label: 'Relationship' }]
    },
    {
      id: 'fitness', name: 'Fitness', icon: 'dumbbell',
      tasks: [{ id: 'exercise', label: 'Exercise' }, { id: 'nutrition', label: 'Nutrition' }]
    },
    {
      id: 'finance', name: 'Finance', icon: 'chart',
      tasks: [{ id: 'learn', label: 'Learn' }, { id: 'plan', label: 'Plan' }]
    }
  ];

  var TASK_TOTAL = PILLARS.reduce(function (n, p) { return n + p.tasks.length; }, 0); // 8
  var BONUS_TOTAL = 2;                       // gratitude + journal
  var DAY_MAX = TASK_TOTAL + BONUS_TOTAL;    // 10 points a day
  var DAY_TARGET = 8;                        // the blue goal line on the chart

  var ICONS = {
    cross: '<svg viewBox="0 0 24 24" fill="none" stroke="#4fd1a5" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M6.5 8.5h11"/></svg>',
    family: '<svg viewBox="0 0 24 24" fill="#f47272"><circle cx="8" cy="8.5" r="3"/><circle cx="16" cy="8.5" r="3"/><path d="M2.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5z"/><path d="M10.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5z"/></svg>',
    dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="#4fd1a5" stroke-width="2.2" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="#e8c85f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 3.5 3.5L21 6"/><path d="M15 6h6v6"/></svg>'
  };

  var CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>';

  /* ---------------- helpers ---------------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls) { var n = document.createElement(tag); if (cls) n.className = cls; return n; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function keyOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parseKey(k) {
    var p = k.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function startOfWeek(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - x.getDay()); return x; }
  function sameDay(a, b) { return keyOf(a) === keyOf(b); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(d) {
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
  }
  function fmtShort(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  /* ---------------- state ---------------- */
  var state = load();
  var viewDate = new Date(); viewDate.setHours(0, 0, 0, 0);
  var range = 'daily';
  var query = '';

  function blankState() {
    return {
      profile: { name: 'Kory', sub: 'K' },
      days: {},      // key -> { tasks: {}, gratitude: [], journal: [] }
      goals: [],
      prayers: []
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return blankState();
      var parsed = JSON.parse(raw);
      var base = blankState();
      return {
        profile: Object.assign(base.profile, parsed.profile || {}),
        days: parsed.days || {},
        goals: Array.isArray(parsed.goals) ? parsed.goals : [],
        prayers: Array.isArray(parsed.prayers) ? parsed.prayers : []
      };
    } catch (e) {
      return blankState();
    }
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save — storage full or blocked'); }
  }

  function day(key) {
    if (!state.days[key]) state.days[key] = { tasks: {}, gratitude: [], journal: [] };
    var d = state.days[key];
    if (!d.tasks) d.tasks = {};
    if (!Array.isArray(d.gratitude)) d.gratitude = [];
    if (!Array.isArray(d.journal)) d.journal = [];
    return d;
  }

  /* ---------------- scoring ---------------- */
  function pointsFor(key) {
    var d = state.days[key];
    if (!d) return 0;
    var pts = 0;
    PILLARS.forEach(function (p) {
      p.tasks.forEach(function (t) { if (d.tasks && d.tasks[p.id + '.' + t.id]) pts++; });
    });
    if (d.gratitude && d.gratitude.length) pts++;
    if (d.journal && d.journal.length) pts++;
    return pts;
  }

  function totalPoints() {
    return Object.keys(state.days).reduce(function (sum, k) { return sum + pointsFor(k); }, 0);
  }

  function streak() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var cursor = today;
    // A streak stays alive until today ends: if nothing is logged yet today,
    // count back starting from yesterday.
    if (pointsFor(keyOf(today)) === 0) cursor = addDays(today, -1);
    var n = 0;
    while (pointsFor(keyOf(cursor)) > 0) { n++; cursor = addDays(cursor, -1); }
    return n;
  }

  /* ---------------- chart data ---------------- */
  function chartSeries() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var out = [];
    var i, d, k;

    if (range === 'daily') {
      for (i = 6; i >= 0; i--) {
        d = addDays(today, -i);
        k = keyOf(d);
        out.push({
          label: d.toLocaleDateString(undefined, { weekday: 'short' }),
          value: pointsFor(k),
          max: DAY_MAX,
          isNow: i === 0
        });
      }
      return { bars: out, max: DAY_MAX, target: DAY_TARGET };
    }

    if (range === 'weekly') {
      var ws = startOfWeek(today);
      for (i = 5; i >= 0; i--) {
        var start = addDays(ws, -7 * i);
        var sum = 0;
        for (var j = 0; j < 7; j++) sum += pointsFor(keyOf(addDays(start, j)));
        out.push({
          label: (start.getMonth() + 1) + '/' + start.getDate(),
          value: sum,
          max: DAY_MAX * 7,
          isNow: i === 0
        });
      }
      return { bars: out, max: DAY_MAX * 7, target: DAY_TARGET * 7 };
    }

    // monthly — last 6 months
    for (i = 5; i >= 0; i--) {
      var m = new Date(today.getFullYear(), today.getMonth() - i, 1);
      var days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      var msum = 0;
      for (var dd = 1; dd <= days; dd++) msum += pointsFor(keyOf(new Date(m.getFullYear(), m.getMonth(), dd)));
      out.push({
        label: m.toLocaleDateString(undefined, { month: 'short' }),
        value: msum,
        max: DAY_MAX * days,
        isNow: i === 0
      });
    }
    var maxDays = 31;
    return { bars: out, max: DAY_MAX * maxDays, target: DAY_TARGET * 30 };
  }

  function rangePoints() {
    var s = chartSeries();
    if (range === 'daily') return s.bars.reduce(function (a, b) { return a + b.value; }, 0);
    return s.bars[s.bars.length - 1].value;
  }

  /* ---------------- rendering ---------------- */
  function renderHeader() {
    $('userName').textContent = state.profile.name;
    $('userSub').textContent = state.profile.sub;
    $('avatar').textContent = (state.profile.name || '?').trim().charAt(0).toUpperCase();
    $('totalPoints').textContent = totalPoints();
    $('streakCount').textContent = streak();
  }

  function renderChart() {
    var s = chartSeries();
    var box = $('chart');
    box.innerHTML = '';

    // dashed grid + axis labels
    var grid = el('div', 'grid');
    var rows = 5;
    for (var r = rows; r >= 0; r--) {
      var line = el('div', 'grid-line');
      var lab = el('span');
      lab.textContent = Math.round(s.max * (r / rows));
      line.appendChild(lab);
      grid.appendChild(line);
    }
    box.appendChild(grid);

    // blue target line
    var t = el('div', 'target');
    var plotH = 168 - 4 - 24; // matches .chart padding
    t.style.bottom = (24 + (s.target / s.max) * plotH) + 'px';
    box.appendChild(t);

    s.bars.forEach(function (b) {
      var col = el('div', 'bar-col');
      var bar = el('div', 'bar');
      var pct = s.max ? Math.min(1, b.value / s.max) : 0;
      bar.style.height = (pct * 100) + '%';
      if (b.value >= (range === 'daily' ? DAY_MAX : s.target)) bar.classList.add('full');
      if (b.isNow) bar.classList.add('today');
      bar.title = b.label + ': ' + b.value + ' points';
      var lab = el('div', 'bar-label');
      lab.textContent = b.label;
      col.appendChild(bar);
      col.appendChild(lab);
      box.appendChild(col);
    });

    $('rangePoints').textContent = rangePoints();
  }

  function renderDateNav() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var isToday = sameDay(viewDate, today);
    var lbl = $('dateLabel');
    lbl.textContent = isToday ? 'Today · ' + fmtDate(viewDate) : fmtDate(viewDate);
    lbl.classList.toggle('past', !isToday);
    $('nextDay').disabled = isToday;
  }

  function renderPillars() {
    var key = keyOf(viewDate);
    var d = day(key);
    var wrap = $('pillars');
    wrap.innerHTML = '';

    PILLARS.forEach(function (p) {
      var doneCount = p.tasks.filter(function (t) { return !!d.tasks[p.id + '.' + t.id]; }).length;
      var complete = doneCount === p.tasks.length;

      var card = el('section', 'pillar' + (complete ? ' complete' : ''));

      var head = el('div', 'pillar-head');
      var h3 = el('h3'); h3.textContent = p.name;
      var count = el('span', 'count');
      count.innerHTML = '<span class="ticks">&#10003;&#10003;</span>' + doneCount + '/' + p.tasks.length;
      head.appendChild(h3); head.appendChild(count);

      var body = el('div', 'pillar-body');
      var ico = el('div', 'pillar-icon');
      ico.innerHTML = ICONS[p.icon];
      body.appendChild(ico);

      p.tasks.forEach(function (t) {
        var id = p.id + '.' + t.id;
        var done = !!d.tasks[id];
        var btn = el('button', 'task' + (done ? ' done' : ''));
        btn.type = 'button';
        btn.setAttribute('aria-pressed', done ? 'true' : 'false');
        btn.innerHTML = '<span class="box">' + CHECK_SVG + '</span><span class="label">' + escapeHtml(t.label) + '</span>';
        btn.addEventListener('click', function () { toggleTask(id); });
        body.appendChild(btn);
      });

      card.appendChild(head);
      card.appendChild(body);
      wrap.appendChild(card);
    });
  }

  function toggleTask(id) {
    var d = day(keyOf(viewDate));
    if (d.tasks[id]) delete d.tasks[id];
    else d.tasks[id] = true;
    save();
    renderPillars();
    renderChart();
    renderHeader();
  }

  function renderBonus() {
    var d = day(keyOf(viewDate));

    var gc = $('gratitudeCount'), jc = $('journalCount');
    gc.textContent = d.gratitude.length;
    gc.classList.toggle('show', d.gratitude.length > 0);
    jc.textContent = d.journal.length;
    jc.classList.toggle('show', d.journal.length > 0);

    var list = $('bonusList');
    list.innerHTML = '';

    var items = []
      .concat(d.gratitude.map(function (e) { return { kind: 'gratitude', e: e }; }))
      .concat(d.journal.map(function (e) { return { kind: 'journal', e: e }; }))
      .filter(function (it) { return matches(it.e.text); })
      .sort(function (a, b) { return b.e.ts - a.e.ts; });

    items.forEach(function (it) {
      var li = el('li', 'entry');
      var main = el('div', 'entry-main');
      var title = el('div', 'entry-title');
      title.textContent = it.kind === 'gratitude' ? 'Gratitude' : 'Journal';
      var body = el('div', 'entry-body');
      body.textContent = it.e.text;
      var meta = el('div', 'entry-meta');
      meta.innerHTML = '<span class="tag ' + (it.kind === 'gratitude' ? 'family' : 'finance') + '">' + it.kind + '</span><span>' + fmtShort(it.e.ts) + '</span>';
      main.appendChild(title); main.appendChild(body); main.appendChild(meta);

      var actions = el('div', 'entry-actions');
      var del = el('button', 'mini-btn danger');
      del.type = 'button'; del.textContent = 'Delete';
      del.addEventListener('click', function () {
        var arr = it.kind === 'gratitude' ? d.gratitude : d.journal;
        var i = arr.findIndex(function (x) { return x.id === it.e.id; });
        if (i > -1) arr.splice(i, 1);
        save(); renderBonus(); renderChart(); renderHeader();
      });
      actions.appendChild(del);

      li.appendChild(main); li.appendChild(actions);
      list.appendChild(li);
    });
  }

  function matches(text) {
    if (!query) return true;
    return String(text || '').toLowerCase().indexOf(query) > -1;
  }

  /* ---------------- goals ---------------- */
  function renderGoals() {
    var list = $('goalList');
    list.innerHTML = '';

    var visible = state.goals.filter(function (g) { return matches(g.text) || matches(g.pillar); });
    var doneCount = state.goals.filter(function (g) { return g.done; }).length;
    $('goalMeta').textContent = doneCount + '/' + state.goals.length + ' complete';

    if (!visible.length) {
      var e = el('li'); e.innerHTML = '<div class="empty">' + (state.goals.length ? 'No goals match your search.' : 'No goals yet — type one above to get started.') + '</div>';
      list.appendChild(e);
      return;
    }

    visible.forEach(function (g) {
      var li = el('li', 'entry' + (g.done ? ' done' : ''));

      var chk = el('button', 'entry-check');
      chk.type = 'button';
      chk.setAttribute('aria-label', 'Toggle goal complete');
      chk.setAttribute('aria-pressed', g.done ? 'true' : 'false');
      chk.innerHTML = CHECK_SVG;
      chk.addEventListener('click', function () {
        g.done = !g.done;
        g.completedAt = g.done ? Date.now() : null;
        save(); renderGoals();
      });

      var main = el('div', 'entry-main');
      var title = el('div', 'entry-title');
      title.textContent = g.text;
      var meta = el('div', 'entry-meta');
      meta.innerHTML = '<span class="tag ' + escapeHtml(g.pillar) + '">' + escapeHtml(g.pillar) + '</span><span>Added ' + fmtShort(g.createdAt) + '</span>' +
        (g.done && g.completedAt ? '<span class="tag answered">done ' + fmtShort(g.completedAt) + '</span>' : '');
      main.appendChild(title); main.appendChild(meta);

      var actions = el('div', 'entry-actions');
      var edit = el('button', 'mini-btn'); edit.type = 'button'; edit.textContent = 'Edit';
      edit.addEventListener('click', function () {
        openModal('Edit goal', g.text, function (val) { g.text = val; save(); renderGoals(); });
      });
      var del = el('button', 'mini-btn danger'); del.type = 'button'; del.textContent = 'Delete';
      del.addEventListener('click', function () {
        state.goals = state.goals.filter(function (x) { return x.id !== g.id; });
        save(); renderGoals(); toast('Goal deleted');
      });
      actions.appendChild(edit); actions.appendChild(del);

      li.appendChild(chk); li.appendChild(main); li.appendChild(actions);
      list.appendChild(li);
    });
  }

  /* ---------------- prayers ---------------- */
  function renderPrayers() {
    var list = $('prayerList');
    list.innerHTML = '';

    var visible = state.prayers.filter(function (p) { return matches(p.title) || matches(p.text); });
    var answered = state.prayers.filter(function (p) { return p.answered; }).length;
    $('prayerMeta').textContent = answered + ' answered · ' + state.prayers.length + ' total';

    if (!visible.length) {
      var e = el('li');
      e.innerHTML = '<div class="empty">' + (state.prayers.length ? 'No prayers match your search.' : 'No prayers yet — write one above.') + '</div>';
      list.appendChild(e);
      return;
    }

    visible.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (p) {
      var li = el('li', 'entry' + (p.answered ? ' done' : ''));

      var chk = el('button', 'entry-check');
      chk.type = 'button';
      chk.setAttribute('aria-label', 'Mark prayer answered');
      chk.setAttribute('aria-pressed', p.answered ? 'true' : 'false');
      chk.innerHTML = CHECK_SVG;
      chk.addEventListener('click', function () {
        p.answered = !p.answered;
        p.answeredAt = p.answered ? Date.now() : null;
        save(); renderPrayers();
        if (p.answered) toast('Marked answered \u{1F64F}');
      });

      var main = el('div', 'entry-main');
      if (p.title) {
        var title = el('div', 'entry-title');
        title.textContent = p.title;
        main.appendChild(title);
      }
      var body = el('div', 'entry-body');
      body.textContent = p.text;
      main.appendChild(body);

      var meta = el('div', 'entry-meta');
      meta.innerHTML = '<span>' + fmtShort(p.ts) + '</span>' +
        (p.answered && p.answeredAt ? '<span class="tag answered">answered ' + fmtShort(p.answeredAt) + '</span>' : '');
      main.appendChild(meta);

      var actions = el('div', 'entry-actions');
      var edit = el('button', 'mini-btn'); edit.type = 'button'; edit.textContent = 'Edit';
      edit.addEventListener('click', function () {
        openModal('Edit prayer', p.text, function (val) { p.text = val; save(); renderPrayers(); });
      });
      var del = el('button', 'mini-btn danger'); del.type = 'button'; del.textContent = 'Delete';
      del.addEventListener('click', function () {
        state.prayers = state.prayers.filter(function (x) { return x.id !== p.id; });
        save(); renderPrayers(); toast('Prayer deleted');
      });
      actions.appendChild(edit); actions.appendChild(del);

      li.appendChild(chk); li.appendChild(main); li.appendChild(actions);
      list.appendChild(li);
    });
  }

  function renderAll() {
    renderHeader();
    renderChart();
    renderDateNav();
    renderPillars();
    renderBonus();
    renderGoals();
    renderPrayers();
  }

  /* ---------------- modal + toast ---------------- */
  var modalSaveHandler = null;
  var modalExtraHandler = null;
  var modalAllowEmpty = false;

  function openModal(title, value, onSave, opts) {
    opts = opts || {};
    $('modalTitle').textContent = title;
    var input = $('modalInput');
    input.value = value || '';
    input.readOnly = !!opts.readonly;
    input.placeholder = opts.placeholder || '';
    $('modalSave').textContent = opts.saveLabel || 'Save';
    $('modalCancel').textContent = opts.cancelLabel || 'Cancel';

    var extra = $('modalExtra');
    if (opts.extraLabel) {
      extra.textContent = opts.extraLabel;
      extra.hidden = false;
      modalExtraHandler = opts.onExtra || null;
    } else {
      extra.hidden = true;
      modalExtraHandler = null;
    }

    modalAllowEmpty = !!opts.allowEmpty;
    modalSaveHandler = onSave;
    $('modal').hidden = false;
    setTimeout(function () { input.focus(); if (opts.readonly) input.select(); }, 30);
  }

  function closeModal() {
    $('modal').hidden = true;
    modalSaveHandler = null;
    modalExtraHandler = null;
    modalAllowEmpty = false;
    $('modalInput').readOnly = false;
  }

  /* Copies text without relying on the clipboard API, which some embedded
     viewers block. Falls back to selecting the text so it can be copied by hand. */
  function copyText(text) {
    var input = $('modalInput');
    input.focus();
    input.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast('Copied to clipboard'); },
        function () { toast('Press Ctrl/Cmd+C to copy'); }
      );
      return;
    }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    toast(ok ? 'Copied to clipboard' : 'Press Ctrl/Cmd+C to copy');
  }

  /* Downloads work when the app is served as a normal page, but some embedded
     viewers block them — so copy/paste is always offered alongside. */
  function tryDownload(filename, text) {
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch (e) { return false; }
  }

  function applyImport(parsed) {
    state = {
      profile: Object.assign(blankState().profile, parsed.profile || {}),
      days: parsed.days || {},
      goals: Array.isArray(parsed.goals) ? parsed.goals : [],
      prayers: Array.isArray(parsed.prayers) ? parsed.prayers : []
    };
    save();
    renderAll();
    toast('Data imported');
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2000);
  }

  /* ---------------- wiring ---------------- */
  function wire() {
    $('rangeSelect').addEventListener('change', function (e) {
      range = e.target.value;
      renderChart();
    });

    $('prevDay').addEventListener('click', function () {
      viewDate = addDays(viewDate, -1);
      renderDateNav(); renderPillars(); renderBonus();
    });
    $('nextDay').addEventListener('click', function () {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      if (sameDay(viewDate, today)) return;
      viewDate = addDays(viewDate, 1);
      renderDateNav(); renderPillars(); renderBonus();
    });
    $('dateLabel').addEventListener('click', function () {
      viewDate = new Date(); viewDate.setHours(0, 0, 0, 0);
      renderDateNav(); renderPillars(); renderBonus();
    });

    $('gratitudeBtn').addEventListener('click', function () {
      openModal('Add Gratitude', '', function (val) {
        day(keyOf(viewDate)).gratitude.push({ id: uid(), text: val, ts: Date.now() });
        save(); renderBonus(); renderChart(); renderHeader();
        toast('Gratitude added +1');
      });
    });

    $('journalBtn').addEventListener('click', function () {
      openModal('Add Journal', '', function (val) {
        day(keyOf(viewDate)).journal.push({ id: uid(), text: val, ts: Date.now() });
        save(); renderBonus(); renderChart(); renderHeader();
        toast('Journal added +1');
      });
    });

    $('modalCancel').addEventListener('click', closeModal);
    $('modalSave').addEventListener('click', function () {
      var val = $('modalInput').value.trim();
      if (!val && !modalAllowEmpty) { toast('Write something first'); return; }
      // a handler returning false keeps the modal open so nothing typed is lost
      if (modalSaveHandler && modalSaveHandler(val) === false) return;
      closeModal();
    });

    $('modalExtra').addEventListener('click', function () {
      if (modalExtraHandler) modalExtraHandler($('modalInput').value);
    });
    $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('modal').hidden) closeModal();
    });

    $('goalForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var text = $('goalInput').value.trim();
      if (!text) { toast('Type a goal first'); return; }
      state.goals.unshift({
        id: uid(), text: text, pillar: $('goalPillar').value,
        done: false, createdAt: Date.now(), completedAt: null
      });
      $('goalInput').value = '';
      save(); renderGoals(); toast('Goal added');
    });

    $('prayerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var text = $('prayerInput').value.trim();
      var title = $('prayerTitle').value.trim();
      if (!text && !title) { toast('Write a prayer first'); return; }
      state.prayers.unshift({
        id: uid(), title: title, text: text || title,
        answered: false, ts: Date.now(), answeredAt: null
      });
      $('prayerInput').value = '';
      $('prayerTitle').value = '';
      save(); renderPrayers(); toast('Prayer saved \u{1F64F}');
    });

    $('searchInput').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      renderGoals(); renderPrayers(); renderBonus();
    });

    $('menuBtn').addEventListener('click', function () {
      var name = prompt('Your name', state.profile.name);
      if (name === null) return;
      state.profile.name = name.trim() || 'Friend';
      state.profile.sub = state.profile.name.trim().charAt(0).toUpperCase();
      save(); renderHeader();
    });

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var target = tab.dataset.scroll;
        if (target === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        var node = $(target) || document.querySelector('.' + target);
        if (node) node.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    $('exportBtn').addEventListener('click', function () {
      var json = JSON.stringify(state, null, 2);
      openModal('Export data', json, function () { copyText(json); }, {
        readonly: true,
        allowEmpty: true,
        saveLabel: 'Copy',
        cancelLabel: 'Close',
        extraLabel: 'Save file',
        onExtra: function () {
          tryDownload('daily-app-backup-' + keyOf(new Date()) + '.json', json);
          toast('If nothing downloaded, use Copy instead');
        }
      });
    });

    $('importBtn').addEventListener('click', function () {
      openModal('Import data', '', function (val) {
        try { applyImport(JSON.parse(val)); }
        catch (err) { toast('That is not valid backup data'); return false; }
      }, {
        placeholder: 'Paste your exported backup here, or choose a file\u2026',
        saveLabel: 'Import',
        extraLabel: 'Choose file',
        onExtra: function () { $('importFile').click(); }
      });
    });
    $('importFile').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          applyImport(JSON.parse(reader.result));
          closeModal();
        } catch (err) { toast('That file could not be read'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    $('resetBtn').addEventListener('click', function () {
      if (!confirm('Erase all check-ins, goals and prayers on this device? This cannot be undone.')) return;
      state = blankState();
      save(); renderAll(); toast('All data cleared');
    });

    // roll the view over to the new day if the app is left open overnight
    setInterval(function () {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      if (!sameDay(viewDate, today) && viewDate < today) {
        viewDate = today;
        renderAll();
      }
    }, 60000);
  }

  /* ---------------- boot ---------------- */
  wire();
  renderAll();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support is optional */ });
  }
})();

</script>
</body>
</html>
